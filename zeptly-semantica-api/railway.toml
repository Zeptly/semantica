# Railway config-as-code for the zeptly-semantica-api service.
# Service settings: Root Directory = zeptly-semantica-api.
# FalkorDB is a separate Railway service (image falkordb/falkordb-server:v4.14.8
# with a volume at /var/lib/falkordb/data); see README.md "Railway deployment".
# No secrets here: SEMANTICA_API_KEY / FALKORDB_PASSWORD are Railway variables.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1
