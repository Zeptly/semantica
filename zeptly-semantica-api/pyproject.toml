[project]
name = "zeptly-semantica-api"
version = "0.1.0"
description = "Derived, non-authoritative semantic projection service over Semantica GraphStore + FalkorDB"
requires-python = ">=3.12,<3.13"
# Runtime dependencies are pinned with hashes in requirements.lock and
# installed with `pip install --no-deps --require-hashes -r requirements.lock`.
# semantica==0.6.0 is deliberately NOT listed here: its published metadata
# pulls the full ML stack, which semantica.graph_store does not need.
# See README.md "Version pinning".
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires a reachable FalkorDB (real graph store, no mocks)",
]
filterwarnings = [
    "error",
    # starlette's TestClient nags about httpx vs httpx2; test-only, not ours.
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP"]
ignore = ["E501", "UP006", "UP007", "UP035", "UP045", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S104", "S105", "S106", "S310", "S603", "E731"]

[tool.mypy]
python_version = "3.12"
packages = ["app"]
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
