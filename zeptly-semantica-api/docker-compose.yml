# Local validation only. Railway runs these as two native services
# (zeptly-semantica-api + FalkorDB) connected over the private network.
name: zeptly-semantica

services:
  falkordb:
    # Pinned by tag and digest (FalkorDB v4.14.8, server-only image: no browser UI).
    image: falkordb/falkordb-server:v4.14.8@sha256:71afd8c7cc44c15caab5fb35343d46bb0dc6ce3ee80a33f599f5d6647cdb50c4
    environment:
      # AOF + RDB persistence and a password, mirroring the Railway posture.
      REDIS_ARGS: >-
        --appendonly yes
        --appendfsync everysec
        --requirepass ${FALKORDB_PASSWORD:-local-falkordb-password}
      # Lets the healthcheck's redis-cli authenticate without echoing the password.
      REDISCLI_AUTH: ${FALKORDB_PASSWORD:-local-falkordb-password}
    volumes:
      - falkordb-data:/var/lib/falkordb/data
    # Not published to the host: only reachable on the compose network.
    expose:
      - "6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  semantica-api:
    build: .
    image: zeptly-semantica-api:local
    depends_on:
      falkordb:
        condition: service_healthy
    environment:
      SEMANTICA_ENV: ${SEMANTICA_ENV:-development}
      SEMANTICA_API_KEY: ${SEMANTICA_API_KEY:?set SEMANTICA_API_KEY (see .env.example)}
      SEMANTICA_ALLOW_ANONYMOUS: "false"
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      FALKORDB_PASSWORD: ${FALKORDB_PASSWORD:-local-falkordb-password}
      FALKORDB_GRAPH: ${FALKORDB_GRAPH:-zeptly_semantica}
      PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  falkordb-data:
